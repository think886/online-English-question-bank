# ==========================================================================
#  英语答题系统 - 应用配置
#
#  ⚠ YAML 三条铁律（新手最常踩）：
#   1. 缩进只能用「空格」，绝对不能用 Tab，否则启动直接报错
#   2. 冒号后面必须有一个空格，写 username:root 是错的，要写 username: root
#   3. 层级靠缩进表达，同一层级的缩进量必须完全一致
# ==========================================================================

spring:
  application:
    name: English-question-bank

  # ------------------------------------------------------------------
  #  数据源：Spring Boot 看到 spring.datasource 就会自动创建
  #  HikariCP 连接池，不需要手写任何 new 代码
  # ------------------------------------------------------------------
  datasource:
    # URL 三个必需参数，缺一个就连不上：
    #   characterEncoding=utf8          中文不乱码
    #   serverTimezone=Asia/Shanghai    否则报时区错误
    #   allowPublicKeyRetrieval=true    MySQL 8 默认用 caching_sha2_password
    #       加密插件，非 SSL 连接下必须允许向服务器索取公钥，
    #       否则报 "Public Key Retrieval is not allowed"（最高频的坑）
    url: "jdbc:mysql://localhost:3306/english_question_bank?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"

    username: root

    # ↓↓↓ 把「你的密码」换成 MySQL root 的真实密码 ↓↓↓
    password: 123456

    # MySQL 8 必须是 com.mysql.cj.jdbc.Driver（老版 com.mysql.jdbc.Driver 已废弃）
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      # 连接池名字，启动日志里看到它就说明池子建起来了
      pool-name: EnglishQbPool

# ======================================================================
#  Actuator 健康检查
#  启动后浏览器访问 http://localhost:8080/actuator/health
#  返回 {"status":"UP"} 就是连上了；连不上返回 HTTP 503
# ======================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 不加这行只能看到笼统的 UP/DOWN，看不到具体哪个组件挂了
      show-details: always

# ======================================================================
#  MyBatis-Plus
# ======================================================================
mybatis-plus:
  configuration:
    # 下划线列名自动映射为驼峰属性：normalized_form -> normalizedForm
    map-underscore-to-camel-case: true
    # 日志实现：交给 SLF4J，而不是 MyBatis 自带的 stdout 实现。
    #
    # 为什么不用 StdOutImpl：
    #   StdOutImpl 的 isDebugEnabled() / isTraceEnabled() 恒返回 true，
    #   且直接调 System.out.println —— 它会「绕过 logback」，
    #   因此不受下面 logging.charset.console=UTF-8 的约束，
    #   在中文 Windows 上按 GBK 输出，国际音标会被毁成 ?（实测 ?'b?nd?n）。
    #   Slf4jImpl 走 logback，编码与级别都受控。
    #
    # ⚠ 代价：换成 Slf4jImpl 后，默认级别（INFO）下「一条 SQL 都看不到」，
    #   必须在下方 logging.level 里把 mapper 包设成 debug 或 trace。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

  global-config:
    # 关掉 MP 启动 banner，日志清爽些
    banner: false
    db-config:
      # 主键策略：我们的表全是 AUTO_INCREMENT，必须设成 auto。
      # MP 默认是 ASSIGN_ID（雪花算法），与自增主键不匹配，
      # 不设这行插入时会往 id 塞一个 19 位雪花值，是高频踩坑点
      id-type: auto

# ======================================================================
#  日志编码：JDK 17 在中文 Windows 上默认用 GBK 输出日志，
#  中文会变乱码，排查清单会没法读。强制 UTF-8
# ======================================================================
logging:
  charset:
    console: UTF-8
    file: UTF-8

  level:
    # MyBatis 的 SQL 日志在这里控制（因为上面把 log-impl 换成了 Slf4jImpl）。
    # logger 名 = Mapper 接口的全限定名。
    #
    #   debug → 打印 SQL 语句与参数（==>  Preparing: / ==> Parameters:）
    #   trace → 额外打印结果集行值（<== Row: ...），非常啰嗦
    #
    # 上线前把这一行删掉或改成 info，即可关闭 SQL 日志，无需改代码。
    org.example.englishquestionbank.mapper: debug
